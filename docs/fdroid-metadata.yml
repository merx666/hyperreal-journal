Summary: Offline harm-reduction journal & bio-telemetry tracker
Description: |-
    Hyperreal Journal to otwartoźródłowa (100% offline) aplikacja służąca edukacji,
    monitorowaniu parametrów bio-telemetrycznych oraz redukcji szkód (harm reduction).

    Główne funkcje:
    * 100% Prywatności Offline — brak serwera, brak analityki, brak usług Google (GMS)
    * Dziennik sesji i kalkulator dawek ze statusem faz (Onset, Peak, Offset)
    * Macierz interakcji i miksów bazująca na danych SIN (Społecznej Inicjatywy Narkopolityki)
    * Szybki moduł pomocy kryzysowej 24H z numerem ratunkowym 112 i liniami wsparcia

